<style>
:root{
  --bg:#eef3ea; --fg:#15211a; --muted:#5d6c61; --line:#d2dbcd; --card:#ffffff;
  --leaf:#1f7a4a; --leaf-soft:#dcefe2; --tag:#ffd94d; --tag-ink:#2b2200;
  --ok:#1f8a4c; --warn:#c77a0e; --bad:#d23a2a;
  --display:"Russo One",system-ui,sans-serif; --hand:"Neucha","Comic Sans MS",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1712; --fg:#e6efe8; --muted:#97a99c; --line:#243329; --card:#16211a;
  --leaf:#4fc283; --leaf-soft:#173323; --ok:#4fc283; --warn:#f0a83a; --bad:#ff6a58; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:1.25rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--tag);color:var(--tag-ink);border-radius:8px;padding:2px 7px;font-size:1rem}
.seg{display:flex;gap:4px}
.seg button{font:inherit;font-weight:700;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.step{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=search],input[inputmode]{width:100%;font:inherit;font-size:1.05rem;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.cats .chip{font-size:.82rem;padding:6px 11px}
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.place{font:inherit;font-weight:700;font-size:.84rem;line-height:1.2;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.place span{font-size:1.3rem}
.place[aria-pressed="true"]{border:2px solid var(--leaf);background:var(--leaf-soft)}
.priceRow{display:flex;gap:8px}
.priceRow input{flex:1;min-width:0;font-family:var(--display);font-size:1.6rem;padding:10px 14px}
.photo{flex:none;font:inherit;font-weight:700;border:1px dashed var(--muted);background:transparent;color:var(--fg);border-radius:12px;padding:0 14px;cursor:pointer;font-size:.85rem;line-height:1.2;text-align:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:5px 9px;cursor:pointer}
.note{font-size:.85rem;color:var(--muted)}
.tag{position:relative;background:var(--tag);color:var(--tag-ink);border-radius:14px;padding:18px 18px 18px 34px;transform:rotate(-1.2deg);box-shadow:0 12px 26px -16px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px}
.tag::before{content:"";position:absolute;left:12px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.tag .item{font-family:var(--hand);font-size:1.35rem;line-height:1.1}
.tag .vi{font-size:.85rem;opacity:.75}
.verdict{align-self:flex-start;font-family:var(--display);font-size:1.15rem;padding:6px 12px;border-radius:8px;color:#fff;background:var(--c,#6b7a70);transform:rotate(1.5deg);margin-top:4px}
.why{font-size:.98rem;font-weight:600}
.say{font:inherit;text-align:left;border:0;background:rgba(0,0,0,.08);color:var(--tag-ink);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.say b{font-family:var(--hand);font-size:1.3rem;line-height:1.1}
.say small{font-size:.78rem;opacity:.75}
.ladder{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ladder h3{margin:0 0 6px;font-size:.95rem}
.rung{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.rung:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);justify-self:center}
.rung.c .dot{background:var(--warn)} .rung.t .dot{background:var(--bad)}
.v{font-weight:800;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.v small{display:block;font-weight:600;font-size:.75rem;color:var(--muted)}
.rung.here{background:var(--leaf-soft);border-radius:8px;padding-inline:6px;margin-inline:-6px}
.tip{background:var(--leaf-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.big{position:fixed;inset:0;z-index:20;background:var(--tag);color:var(--tag-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.big b{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,12vw,4.6rem);line-height:1.05;overflow-wrap:anywhere}
.big span{font-size:1.1rem}
.big button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 20px;background:var(--tag-ink);color:var(--tag);cursor:pointer}
[hidden]{display:none!important}
footer{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><i>₫</i> Почём Нячанг</div>
    <div class="seg" role="group" aria-label="Валюта">
      <button type="button" data-cur="vnd" aria-pressed="true">₫</button>
      <button type="button" data-cur="rub" aria-pressed="false">₽</button>
      <button type="button" data-cur="kzt" aria-pressed="false">₸</button>
    </div>
  </div>

  <div class="step">
    <span class="lbl">1 · Что покупаешь</span>
    <input id="q" type="search" placeholder="Кокос, фо, Grab до аэропорта…" autocomplete="off" aria-label="Поиск">
    <div class="chips cats" id="cats"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="step">
    <span class="lbl">2 · Где ты</span>
    <div class="places" role="group" aria-label="Где ты">
      <button type="button" class="place" data-p="s" aria-pressed="true"><span>🛵</span>Улица / рынок</button>
      <button type="button" class="place" data-p="c" aria-pressed="false"><span>🏪</span>Кафе / магазин</button>
      <button type="button" class="place" data-p="t" aria-pressed="false"><span>🏖</span>Набережная / отель</button>
    </div>
  </div>

  <div class="step">
    <span class="lbl">3 · Сколько просят, донгов</span>
    <div class="priceRow">
      <input id="pr" inputmode="numeric" placeholder="50000" aria-label="Цена в донгах">
      <button type="button" class="photo" id="photo">📷<br>Фото</button>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <div class="quick" id="quick"></div>
    <span class="note" id="photoNote" hidden></span>
  </div>

  <div class="tag" aria-live="polite">
    <div><div class="item" id="t-item"></div><div class="vi" id="t-vi"></div></div>
    <span class="verdict" id="t-v"></span>
    <div class="why" id="t-why"></div>
    <button type="button" class="say" id="t-say"></button>
  </div>

  <div class="ladder"><h3>Лестница цен</h3><div id="ladder"></div></div>
  <div class="tip" id="tip" hidden></div>
  <footer id="cnt">Загружаю цены…</footer>
</div>

<div class="big" id="big" hidden role="dialog" aria-modal="true" aria-label="Фраза для продавца">
  <b id="big-vi"></b><span id="big-ru"></span>
  <button type="button" id="big-x">Закрыть</button>
</div>

<script>
(function(){
  var C=window.CONFIG, tg=window.Telegram&&Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand();}catch(e){}}
  var tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  var uid=(function(){
    if(tgUser&&tgUser.id) return 'tg'+tgUser.id;
    try{var x=localStorage.getItem('cb_uid');if(!x){x='web'+Math.random().toString(36).slice(2,10);localStorage.setItem('cb_uid',x);}return x;}catch(e){return 'web-anon';}
  })();
  var sb=null;
  if(C.SUPABASE_URL&&C.SUPABASE_KEY&&window.supabase){try{sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{auth:{persistSession:false}});}catch(e){}}
  function log(type,d){
    if(!sb) return; d=d||{};
    sb.from('events').insert({uid:uid,tg_id:tgUser?tgUser.id:null,source:tg&&tg.initData?'tg':'web',lang:(tgUser&&tgUser.language_code)||navigator.language||null,type:type,item:d.item||null,place:d.place||null,price:d.price||null,verdict:d.verdict||null}).then(function(){},function(){});
  }

  function parseCSV(t){
    var rows=[],row=[],f='',q=false;
    for(var i=0;i<t.length;i++){var ch=t[i];
      if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
      else if(ch==='"')q=true; else if(ch===','){row.push(f);f='';}
      else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
      else f+=ch;}
    if(f||row.length){row.push(f);rows.push(row);}
    var h=rows.shift();return rows.filter(function(r){return r.length>1&&r[0];}).map(function(r){var o={};h.forEach(function(k,j){o[k.trim()]=(r[j]||'').trim();});return o;});
  }
  function rng(a,b){a=parseInt(a,10);b=parseInt(b,10);if(isNaN(a)&&isNaN(b))return null;if(isNaN(a))a=b;if(isNaN(b))b=a;return [a,b];}

  var I=[],RATE={vnd:{k:1,s:'₫'},rub:{k:325,s:'₽'},kzt:{k:50,s:'₸'}};
  var st={item:null,place:'s',cur:'vnd',cat:'Все'};
  var fmt=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
  function money(v){if(st.cur==='vnd')return fmt.format(v)+' ₫';return '≈'+fmt.format(Math.round(v/RATE[st.cur].k))+' '+RATE[st.cur].s;}
  function k(v){return v>=1000?String(Math.round(v/100)/10).replace('.',',').replace(/,0$/,'')+'k':String(v);}
  function range(t){if(st.cur!=='vnd')return t[0]===t[1]?money(t[0]):money(t[0])+' – '+money(t[1]).replace('≈','');return t[0]===t[1]?k(t[0])+' ₫':k(t[0])+'–'+k(t[1])+' ₫';}
  function item(){return I.filter(function(x){return x.id===st.item;})[0];}
  function ceil(it,p){
    if(it[p])return{v:it[p][1],est:false};
    var b=it.c||it.s||it.t;
    if(p==='s')return{v:(it.c||b)[1],est:true};
    if(p==='c')return{v:it.s?Math.round(it.s[1]*1.6/1000)*1000:b[1],est:true};
    return{v:Math.round((it.c||b)[1]*1.6/1000)*1000,est:true};
  }

  var chips=document.getElementById('chips'),cats=document.getElementById('cats');
  function drawCats(){
    var list=['Все'];I.forEach(function(x){if(list.indexOf(x.cat)<0)list.push(x.cat);});
    cats.innerHTML='';list.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',c===st.cat?'true':'false');
      b.addEventListener('click',function(){st.cat=c;drawCats();drawChips(document.getElementById('q').value);});cats.appendChild(b);});
  }
  function drawChips(f){
    chips.innerHTML='';f=(f||'').toLowerCase().trim();
    I.filter(function(x){return (st.cat==='Все'||x.cat===st.cat)&&(!f||(x.name+' '+x.vi).toLowerCase().indexOf(f)>-1);}).forEach(function(x){
      var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x.emoji+' '+x.name;
      b.setAttribute('aria-pressed',x.id===st.item?'true':'false');
      b.addEventListener('click',function(){st.item=x.id;document.getElementById('pr').value='';drawChips(document.getElementById('q').value);render(true);});
      chips.appendChild(b);});
  }
  var lastLogged='',logTimer=null,lastVerdict='';
  function render(fromUser){
    var it=item();if(!it)return;
    var p=parseInt(String(document.getElementById('pr').value).replace(/\D/g,''),10)||0;
    var c=ceil(it,st.place);
    document.getElementById('t-item').textContent=it.emoji+' '+it.name;
    document.getElementById('t-vi').textContent=it.vi+(p?' · просят '+money(p):'');
    var v=document.getElementById('t-v'),why=document.getElementById('t-why'),say=document.getElementById('t-say'),ph,verdict='';
    if(!p){v.textContent='Введи цену';v.style.setProperty('--c','#6b7a70');why.textContent='Нормально здесь — до '+money(c.v)+(c.est?' (оценка)':'')+'.';ph=['Bao nhiêu tiền?','Сколько стоит?'];}
    else if(p<=c.v){verdict='ok';v.textContent='Норм цена 👍';v.style.setProperty('--c','var(--ok)');why.textContent='Здесь обычно до '+money(c.v)+(c.est?' (оценка)':'')+'.';ph=['Cảm ơn!','Спасибо!'];}
    else if(p<=c.v*1.5){verdict='warn';v.textContent='Дороговато';v.style.setProperty('--c','var(--warn)');why.textContent='Обычно до '+money(c.v)+'. Можно поторговаться.';ph=['Bớt được không?','Можно дешевле?'];}
    else{verdict='tourist';v.textContent='Цена для туриста';v.style.setProperty('--c','var(--bad)');why.textContent='Переплата в '+(p/c.v).toFixed(1).replace('.',',')+' раза. Обычно до '+money(c.v)+'.';ph=['Đắt quá!','Слишком дорого!'];}
    say.innerHTML='<b></b><small>Нажми, чтобы показать продавцу крупно</small>';say.querySelector('b').textContent=ph[0]+' — '+ph[1];
    say.onclick=function(){openBig(ph[0],ph[1]);};
    if(tg&&verdict&&verdict!==lastVerdict&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred(verdict==='ok'?'success':verdict==='warn'?'warning':'error');}catch(e){}}
    lastVerdict=verdict;
    var L=document.getElementById('ladder');L.innerHTML='';
    [['s','🛵 Улица / рынок'],['c','🏪 Кафе / магазин'],['t','🏖 Набережная / отель']].forEach(function(r){
      var d=document.createElement('div');d.className='rung '+r[0]+(st.place===r[0]?' here':'');
      d.innerHTML='<span class="dot"></span><span></span><span class="v"></span>';d.children[1].textContent=r[1];
      if(it[r[0]])d.children[2].textContent=range(it[r[0]]);
      else{var cc=ceil(it,r[0]);d.children[2].textContent=r[0]==='t'?'до ~'+(st.cur==='vnd'?k(cc.v)+' ₫':money(cc.v).replace('≈','')):'—';var e=document.createElement('small');e.textContent=r[0]==='t'?'оценка':'ещё не собрали';d.children[2].appendChild(e);}
      L.appendChild(d);});
    var tip=document.getElementById('tip');if(it.tip){tip.textContent='💡 '+it.tip;tip.hidden=false;}else tip.hidden=true;
    var q=document.getElementById('quick');q.innerHTML='';
    [c.v,Math.round(c.v*1.3/1000)*1000,Math.round(c.v*2/1000)*1000,Math.round(c.v*3.5/1000)*1000].forEach(function(x){var b=document.createElement('button');b.type='button';b.textContent=k(x);b.addEventListener('click',function(){document.getElementById('pr').value=x;render(true);});q.appendChild(b);});
    if(p&&fromUser){var key=it.id+'|'+st.place+'|'+p;clearTimeout(logTimer);logTimer=setTimeout(function(){if(key!==lastLogged){lastLogged=key;log('check',{item:it.id,place:st.place,price:p,verdict:verdict});}},1500);}
  }
  document.querySelectorAll('.place').forEach(function(b){b.addEventListener('click',function(){st.place=b.dataset.p;document.querySelectorAll('.place').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});render(true);});});
  document.querySelectorAll('[data-cur]').forEach(function(b){b.addEventListener('click',function(){st.cur=b.dataset.cur;document.querySelectorAll('[data-cur]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});render(false);});});
  document.getElementById('pr').addEventListener('input',function(){render(true);});
  document.getElementById('q').addEventListener('input',function(e){drawChips(e.target.value);});

  // ---------- Фото ----------
  var note=document.getElementById('photoNote');
  document.getElementById('photo').addEventListener('click',function(){
    if(!C.PHOTO_URL){note.textContent='Проверка по фото скоро появится. Пока выбери товар и введи цену.';note.hidden=false;return;}
    document.getElementById('file').click();
  });
  document.getElementById('file').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    note.textContent='📷 Распознаю ценник…';note.hidden=false;
    var img=new Image(),url=URL.createObjectURL(f);
    img.onload=function(){
      var s=Math.min(1,1024/Math.max(img.width,img.height)),cv=document.createElement('canvas');
      cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      var b64=cv.toDataURL('image/jpeg',0.75).split(',')[1];
      fetch(C.PHOTO_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.SUPABASE_KEY},
        body:JSON.stringify({image:b64,items:I.map(function(x){return{id:x.id,name:x.name,vi:x.vi};})})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.error)throw new Error(d.error);
        var hit=I.filter(function(x){return x.id===d.item_id;})[0];
        if(hit){st.item=hit.id;drawChips('');}
        if(d.price_vnd)document.getElementById('pr').value=d.price_vnd;
        note.textContent=hit?'✅ Распознал: '+(d.name_ru||hit.name)+(d.price_vnd?', '+fmt.format(d.price_vnd)+' ₫':'. Цену не нашёл — введи вручную.')
          :'Распознал: '+(d.name_ru||'не понял товар')+(d.price_vnd?', '+fmt.format(d.price_vnd)+' ₫':'')+'. Этого товара пока нет в базе — выбери похожий вручную.';
        render(false);
        log('photo',{item:hit?hit.id:(d.name_ru||'unknown'),place:st.place,price:d.price_vnd||null,verdict:lastVerdict||null});
      })
      .catch(function(){note.textContent='Не получилось распознать. Попробуй ещё раз или введи цену вручную.';});
    };
    img.src=url;e.target.value='';
  });

  // ---------- Фраза крупно ----------
  var big=document.getElementById('big'),last=null;
  function openBig(vi,ru){last=document.activeElement;document.getElementById('big-vi').textContent=vi;document.getElementById('big-ru').textContent=ru;big.hidden=false;document.getElementById('big-x').focus();log('phrase',{item:st.item});}
  function close(){big.hidden=true;if(last)last.focus();}
  document.getElementById('big-x').addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!big.hidden)close();});

  // ---------- Загрузка цен ----------
  fetch('items.csv?v='+Date.now()).then(function(r){return r.text();}).then(function(t){
    I=parseCSV(t).map(function(o){return{id:o.id,cat:o.cat,emoji:o.emoji,name:o.name,vi:o.vi,s:rng(o.s_min,o.s_max),c:rng(o.c_min,o.c_max),t:rng(o.t_min,o.t_max),tip:o.tip};}).filter(function(x){return x.s||x.c||x.t;});
    st.item=I[0].id;drawCats();drawChips('');render(false);
    document.getElementById('cnt').textContent='В базе: '+I.length+' · цены собраны вручную в Нячанге';
    log('open');
  }).catch(function(){document.getElementById('cnt').textContent='Не удалось загрузить цены. Проверь интернет и открой снова.';});
})();
</script>
